packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@google/genai': false
  '@playwright/browser-chromium': true
  better-sqlite3: true
  esbuild: true
  msw: false
  node-llama-cpp: false
  playwright: true
  protobufjs: false
  sharp: true
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
