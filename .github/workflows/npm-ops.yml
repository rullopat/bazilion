# Manual npm dist-tag maintenance. The npm token exists only in CI, so these run here.
name: npm ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options:
          - remove-dist-tag
          - add-dist-tag
        required: true
      package:
        description: 'Package name'
        required: true
        default: 'bazilion'
      tag:
        description: 'remove-dist-tag: the dist-tag to remove. add-dist-tag: the dist-tag to create.'
        required: true
      version:
        description: 'add-dist-tag: the published version the tag points at.'
        required: false

permissions:
  contents: read

jobs:
  remove-dist-tag:
    if: inputs.action == 'remove-dist-tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org
      # Inputs reach the shell as environment variables, never as interpolated script text.
      - name: Remove dist-tag
        run: npm dist-tag rm "$PACKAGE" "$TAG"
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  add-dist-tag:
    if: inputs.action == 'add-dist-tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org
      - name: Add dist-tag
        run: npm dist-tag add "$PACKAGE@$VERSION" "$TAG"
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
