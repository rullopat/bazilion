# Manual npm registry maintenance that cannot run locally (publishing is
# CI-only by design — npm credentials exist nowhere else).
name: npm ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options:
          - remove-dist-tag
          - publish-ref-as-version
        required: true
      package:
        description: 'Package name (bazilion, @bazilion/client, @bazilion/api-types)'
        required: true
      tag:
        description: 'remove-dist-tag: the dist-tag to remove.'
        required: false
      ref:
        description: 'publish-ref-as-version: the git ref to publish from.'
        required: false
      version:
        description: 'publish-ref-as-version: the version to publish it as.'
        required: false
      npm-tag:
        description: 'publish-ref-as-version: the npm dist-tag (default latest; use an explicit tag to avoid moving latest).'
        required: false
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  remove-dist-tag:
    if: inputs.action == 'remove-dist-tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Remove dist-tag
        run: npm dist-tag rm "${{ inputs.package }}" "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ref-as-version:
    if: inputs.action == 'publish-ref-as-version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Set the target version
        run: |
          set -euo pipefail
          for pkg in apps/cli/package.json packages/client/package.json packages/api-types/package.json; do
            node -e "
              const fs = require('fs');
              const p = '$pkg';
              const d = JSON.parse(fs.readFileSync(p, 'utf8'));
              d.version = '${{ inputs.version }}';
              fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
            "
          done
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm build
      - name: Publish
        run: pnpm publish --access public --tag "${{ inputs.npm-tag }}" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
