name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The published CLI is a bundle; install the packed tarball and run it once.
      - name: Pack and smoke-test the CLI
        run: |
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP")
          node scripts/pack-smoke.mjs "$RUNNER_TEMP"/bazilion-*.tgz

  docker:
    name: Docker sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The sandbox never pulls images itself (`--pull never`), so pull the test image first.
      - run: docker pull debian:bookworm-slim
      - run: pnpm test:docker
