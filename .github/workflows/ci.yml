name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the older run — saves CI minutes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Pack each publishable package to catch regressions in package.json
      # `files`/`bin`/`exports` BEFORE they hit a real release.
      - name: Verify publishable tarballs
        run: |
          for pkg in packages/api-types packages/client apps/cli; do
            (cd "$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP") || exit 1
          done

      # Surface a friendly hint if the PR touches publishable packages but
      # didn't include a changeset. Doesn't fail the build — soft signal.
      - name: Changeset status (informational)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: pnpm changeset status --since=origin/main
