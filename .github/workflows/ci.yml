name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The published CLI is a bundle; install the packed tarball and run it once.
      - name: Pack and smoke-test the CLI
        run: |
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP")
          node scripts/pack-smoke.mjs "$RUNNER_TEMP"/bazilion-*.tgz

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The runner's Google Chrome drives the built web UI against a stand-in model server, and
      # compares its pictures with the references in e2e/pictures/.
      - run: pnpm test:e2e
      # The pictures that differ, with their references and the difference marked in red;
      # `pnpm pictures:accept` takes them as the new references when the change is meant.
      - name: Keep the pictures that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pictures
          path: e2e/.pictures-out/
          if-no-files-found: ignore

  docker:
    name: Docker sandbox tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The sandbox never pulls images itself (`--pull never`), so pull the test image first.
      - run: docker pull debian:bookworm-slim
      - run: pnpm test:docker
